karat:
  api:
    timeout: 30 # API call timeout in seconds
    max_concurrency: 5 # max parallel Kafka API calls (e.g. ListConsumerGroupOffsets)
  ui:
    # Regex patterns used to classify topics as internal when hiding internal
    # topics (press "i" on the Topics page). Override this list in your own
    # config to match your naming conventions, e.g. "_schemas" or "connect-.*".
    internal_topic_patterns:
      - "^__.*"
      - ".*-changelog$"
      - ".*-repartition$"
