# Local test environment for karat.
#
#   docker-compose up -d                      core stack (Kafka, Schema Registry, Connect, seed data)
#   docker-compose --profile txn up -d        + transactional producer (Transactions page)
#   docker-compose --profile console up -d    + Redpanda Console on http://localhost:20065
#   docker-compose down -v                    tear everything down
#
# Host endpoints: Kafka 127.0.0.1:9092, Schema Registry 127.0.0.1:8081, Connect 127.0.0.1:8083.
# Point karat at them with:
#   mkdir -p .local/.config/karat
#   cp examples/config.local.yaml .local/.config/karat/config.yaml
#   KARAT_CONFIG_DIR=$PWD/.local go run main.go

services:
  # Kafka broker in KRaft mode. StandardAuthorizer is on so the ACLs page has something to
  # show; PLAINTEXT clients authenticate as ANONYMOUS, which is a super user, so nothing is
  # actually denied.
  kafka:
    image: apache/kafka:4.0.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      # KRaft settings
      - KAFKA_NODE_ID=0
      - KAFKA_PROCESS_ROLES=controller,broker
      - KAFKA_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      # Listeners
      - KAFKA_LISTENERS=INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=INTERNAL://kafka:29092,EXTERNAL://127.0.0.1:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL
      # Authorization (ACLs page)
      - KAFKA_AUTHORIZER_CLASS_NAME=org.apache.kafka.metadata.authorizer.StandardAuthorizer
      - KAFKA_SUPER_USERS=User:ANONYMOUS
      - KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND=true
      # Single broker: keep internal topics replicated once
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=false
      - KAFKA_HEAP_OPTS=-Xmx512m -Xms256m
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9092"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - karat-ntw

  schema-registry:
    image: confluentinc/cp-schema-registry:7.9.0
    container_name: schema-registry
    ports:
      - "8081:8081"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      - SCHEMA_REGISTRY_HOST_NAME=schema-registry
      - SCHEMA_REGISTRY_LISTENERS=http://0.0.0.0:8081
      - SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS=PLAINTEXT://kafka:29092
      - SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR=1
      - SCHEMA_REGISTRY_HEAP_OPTS=-Xmx320m -Xms192m
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - karat-ntw

  # Kafka Connect, distributed mode, single worker. Backs the Connect / Connectors pages.
  kafka-connect:
    image: confluentinc/cp-kafka-connect:7.9.0
    container_name: kafka-connect
    ports:
      - "8083:8083"
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    volumes:
      - ./connect/data:/data:ro
    environment:
      CONNECT_BOOTSTRAP_SERVERS: kafka:29092
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect
      CONNECT_REST_PORT: 8083
      CONNECT_GROUP_ID: karat-connect
      CONNECT_CONFIG_STORAGE_TOPIC: connect-configs
      CONNECT_OFFSET_STORAGE_TOPIC: connect-offsets
      CONNECT_STATUS_STORAGE_TOPIC: connect-status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_PLUGIN_PATH: /usr/share/java,/usr/share/filestream-connectors,/usr/share/confluent-hub-components
      KAFKA_HEAP_OPTS: -Xmx512m -Xms256m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/connectors || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    networks:
      - karat-ntw

  # Topics + ACLs initialization
  topic-setup:
    image: apache/kafka:4.0.0
    container_name: kafka-setup
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./topics/create.sh:/create.sh:ro
    environment:
      - KAFKA_HEAP_OPTS=-Xmx256m
    command: bash /create.sh
    restart: on-failure
    networks:
      - karat-ntw

  # AVRO schemas initialization
  schema-setup:
    image: alpine:latest
    container_name: schema-setup
    depends_on:
      schema-registry:
        condition: service_healthy
    volumes:
      - ./schemas:/schemas:ro
    command: sh /schemas/register.sh
    restart: on-failure
    networks:
      - karat-ntw

  # Connector initialization: one healthy source, one healthy sink, one deliberately broken
  # connector so the Connectors page shows a FAILED task too.
  connect-setup:
    image: alpine:latest
    container_name: connect-setup
    depends_on:
      kafka-connect:
        condition: service_healthy
    volumes:
      - ./connect:/connect:ro
    command: sh /connect/register.sh
    restart: on-failure
    networks:
      - karat-ntw

  # Data generator: Avro-encoded keys and values in the Confluent wire format, so the topics
  # carry data that the Schema Registry can actually decode.
  data-generator:
    build:
      context: ./data-generator
      dockerfile: Dockerfile
    container_name: data-generator
    depends_on:
      topic-setup:
        condition: service_completed_successfully
      schema-setup:
        condition: service_completed_successfully
    volumes:
      - ./schemas:/schemas:ro
    environment:
      - KAFKA_BROKER=kafka:29092
      - SCHEMA_REGISTRY_URL=http://schema-registry:8081
      - SCHEMA_DIR=/schemas
      - ALPHA_TOPIC=stream-alpha
      - BETA_TOPIC=stream-beta
      - EVENT_RATE=50  # Events per second
      - LINK_RATIO=0.1  # 10% of alpha records get a linked beta record
    restart: on-failure
    networks:
      - karat-ntw

  # Consumer group that keeps up with the producer (lag ~ 0).
  consumer-live:
    image: edenhill/kcat:1.7.1
    platform: linux/amd64 # kcat publishes no arm64 image
    container_name: consumer-live
    depends_on:
      topic-setup:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh", "-c"]
    command: >
      'kcat -b kafka:29092 -q -X auto.offset.reset=earliest -G stream-alpha-live stream-alpha stream-beta > /dev/null'
    restart: on-failure
    networks:
      - karat-ntw

  # Consumer group that falls behind on purpose, so the Consumer Groups page shows real lag.
  consumer-lagging:
    image: edenhill/kcat:1.7.1
    platform: linux/amd64 # kcat publishes no arm64 image
    container_name: consumer-lagging
    depends_on:
      topic-setup:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh", "-c"]
    command: >
      'while true; do kcat -b kafka:29092 -q -X auto.offset.reset=earliest -c 200 -e -G stream-alpha-lagging stream-alpha > /dev/null; sleep 60; done'
    restart: on-failure
    networks:
      - karat-ntw

  # Transactional producer, feeds the Transactions page. Extra ~300 MB of JVM, so opt-in.
  txn-producer:
    image: apache/kafka:4.0.0
    container_name: txn-producer
    profiles: ["txn"]
    depends_on:
      topic-setup:
        condition: service_completed_successfully
    environment:
      - KAFKA_HEAP_OPTS=-Xmx256m
    command:
      - bash
      - -c
      - >
        while true; do
        /opt/kafka/bin/kafka-producer-perf-test.sh --topic txn-events --num-records 2000
        --record-size 256 --throughput 100 --transactional-id karat-txn-1
        --transaction-duration-ms 2000 --producer-props bootstrap.servers=kafka:29092;
        sleep 5;
        done
    restart: on-failure
    networks:
      - karat-ntw

  console:
    container_name: redpanda-console
    image: docker.redpanda.com/redpandadata/console:latest
    profiles: ["console"]
    networks:
      - karat-ntw
    entrypoint: /bin/sh
    command: -c 'echo "$$CONSOLE_CONFIG_FILE" > /tmp/config.yml && /app/console'
    environment:
      CONFIG_FILEPATH: ${CONFIG_FILEPATH:-/tmp/config.yml}
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["kafka:29092"]
          startup:
            maxRetries: 5
            retryInterval: 1s
            maxRetryInterval: 60s
            backoffMultiplier: 2
        schemaRegistry:
          enabled: true
          urls: ["http://schema-registry:8081"]
    restart: on-failure
    ports:
      - "20065:8080"
    depends_on:
      kafka:
        condition: service_healthy

networks:
  karat-ntw:
    driver: bridge
